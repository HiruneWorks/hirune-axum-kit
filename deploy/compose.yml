name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-runtime: &runtime
  image: ${APP_IMAGE:?Set APP_IMAGE}
  env_file:
    - ../.envs/.${DEPLOY_ENV:?Set DEPLOY_ENV}/app.env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=512m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *runtime
    entrypoint: [api]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
  worker:
    <<: *runtime
    entrypoint: [worker]
  migration:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    profiles: [maintenance]
    env_file:
      - ../.envs/.${DEPLOY_ENV:?Set DEPLOY_ENV}/migration.env
    entrypoint: [migration]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  manage:
    <<: *runtime
    profiles: [maintenance]
    entrypoint: [manage]
    restart: "no"
  maintenance:
    <<: *runtime
    profiles: [maintenance]
    env_file:
      - ../.envs/.${DEPLOY_ENV:?Set DEPLOY_ENV}/app.env
      - ../.envs/.${DEPLOY_ENV:?Set DEPLOY_ENV}/maintenance.env
    entrypoint: [manage]
    command: [cleanup]
    restart: "no"
