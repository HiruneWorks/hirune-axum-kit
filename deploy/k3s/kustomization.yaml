apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hirune-kit
resources:
  - namespace.yaml
  - workloads.yaml
  - gateway.yaml
  - tunnel.yaml
  - migration.yaml
  - network-policies.yaml
  - disruption-budgets.yaml
configMapGenerator:
  - name: hirune-settings
    envs: [app.env]
  - name: hirune-apisix
    files:
      - config.yaml=apisix/config.yaml
      - apisix.yaml=apisix/apisix.yaml
images:
  - name: hirune-kit
    newName: registry.example.com/your-project/hirune-kit
    newTag: 0.1.0
