name: PostgreSQL image
on:
  push:
    tags: ["postgres-v*"]
  # Manual runs verify the candidate without publishing it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64:
    uses: ./.github/workflows/arm64.yml
  verify-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate PostgreSQL release tag
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^postgres-v[0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Use postgres-v followed by a version that starts with a digit.' >&2
            exit 1
          fi
      - name: Build PostgreSQL candidate
        run: |
          docker build --file compose/production/postgres/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag hirune-postgres-pgbackrest:candidate .
      - name: Build application migration image
        run: docker build --file compose/production/app/Dockerfile --tag hirune-kit:postgres-verification .
      - name: Verify the PostgreSQL candidate and physical recovery
        run: python3 -u compose/data-services/verify.py
        env:
          DATA_TEST_APP_IMAGE: hirune-kit:postgres-verification
          DATA_TEST_POSTGRES_IMAGE: hirune-postgres-pgbackrest:candidate
      - name: Export the tested PostgreSQL image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/postgres-v')
        run: docker save --output "$RUNNER_TEMP/postgres-candidate.tar" hirune-postgres-pgbackrest:candidate
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/postgres-v')
        with:
          name: postgres-candidate-amd64
          path: ${{ runner.temp }}/postgres-candidate.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/postgres-v')
    needs: [verify-amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: postgres-candidate-amd64
          path: ${{ runner.temp }}/amd64
      - uses: actions/download-artifact@v8
        with:
          name: arm64-candidate
          path: ${{ runner.temp }}/arm64
      - name: Load the exact tested PostgreSQL images
        env:
          ARM64_POSTGRES: local/arm64-postgres:${{ needs.arm64.outputs.source_sha }}
        run: |
          docker load --input "$RUNNER_TEMP/amd64/postgres-candidate.tar"
          docker load --input "$RUNNER_TEMP/arm64/image.tar"
          python3 scripts/verify_container_archive.py "$RUNNER_TEMP/amd64/postgres-candidate.tar" hirune-postgres-pgbackrest:candidate
          python3 scripts/verify_container_archive.py "$RUNNER_TEMP/arm64/image.tar" "$ARM64_POSTGRES"
      - name: Publish both verified PostgreSQL platforms
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM64_POSTGRES: local/arm64-postgres:${{ needs.arm64.outputs.source_sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-postgres"
          version="${GITHUB_REF_NAME#postgres-v}"
          reference="$(python3 scripts/publish_multiarch_image.py "$repository" "$version" hirune-postgres-pgbackrest:candidate "$ARM64_POSTGRES")"
          printf 'POSTGRES_IMAGE=%s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
