# Copy to ignored .envs/.production/k3s-secrets.yaml and supply real credentials.
apiVersion: v1
kind: Secret
metadata: {name: hirune-app-secrets, namespace: hirune-kit}
type: Opaque
stringData:
  ACTIVE_SECRET_KEY: production-v1
  SECRET_KEYS: '{"production-v1":"REPLACE_WITH_BASE64_32_BYTE_KEY"}'
  RATE_LIMIT_KEY: REPLACE_WITH_INDEPENDENT_RANDOM_SECRET
  INTERNAL_PROXY_SECRET: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  OIDC_PROVIDERS: "[]"
---
apiVersion: v1
kind: Secret
metadata: {name: hirune-runtime-database, namespace: hirune-kit}
type: Opaque
stringData:
  DATABASE_URL: postgres://runtime:REPLACE_ME@database.example.com:5432/app?sslmode=require
---
apiVersion: v1
kind: Secret
metadata: {name: hirune-maintenance-database, namespace: hirune-kit}
type: Opaque
stringData:
  DATABASE_URL: postgres://maintenance:REPLACE_ME@database.example.com:5432/app?sslmode=require
---
apiVersion: v1
kind: Secret
metadata: {name: hirune-migration-database, namespace: hirune-kit}
type: Opaque
stringData:
  MIGRATION_DATABASE_URL: postgres://schema_owner:REPLACE_ME@database.example.com:5432/app?sslmode=require
---
apiVersion: v1
kind: Secret
metadata: {name: hirune-tunnel, namespace: hirune-kit}
type: Opaque
stringData:
  TUNNEL_TOKEN: REPLACE_WITH_REMOTELY_MANAGED_TUNNEL_TOKEN
