name: hirune-axum-kit

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: kit
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d kit"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${SMTP_PORT:-10259}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8029}:8025"

volumes:
  postgres_data:
